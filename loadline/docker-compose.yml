# Local stack. Phase 1 needs only Postgres; Redis arrives with rate limits,
# and the observability stack with Phase 1 slice 7 / Phase 2.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: loadline
      POSTGRES_DB: loadline
    ports: ["5432:5432"]
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]

  migrate:
    image: golang:1.24
    working_dir: /src
    volumes: [".:/src"]
    environment:
      LOADLINE_DATABASE_URL: postgres://postgres:loadline@postgres:5432/loadline?sslmode=disable
    command: ["go", "run", "./cmd/loadline", "migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    image: golang:1.24
    working_dir: /src
    volumes: [".:/src"]
    environment:
      LOADLINE_DATABASE_URL: postgres://postgres:loadline@postgres:5432/loadline?sslmode=disable
    command: ["go", "run", "./cmd/loadline", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
